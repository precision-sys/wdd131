<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Book</title>

    
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Recipe Book">
    <meta property="og:description" content="A collection of my favorite recipes.">
    <meta property="og:url" content="https://precision-sys.github.io/wdd131/recipes/index.html">
    <meta property="og:image" content="images/social-preview-image.png">

    <!-- X Card -->
    <meta name="twitter:card" content="Social_Preview_Image">
    <meta name="twitter:title" content="Recipe Book">
    <meta name="twitter:description" content="A collection of my favorite recipes.">
    <meta name="twitter:image" content="images/social-preview-image.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="images/recipe-book-favicon.png" type="image/png">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
                

    <meta name="description" content="A collection of my favorite recipes.">
    <meta name="author" content="Tiana Andriarimalala">
    <link rel="stylesheet" href="recipes.css">
</head>

<body>
    <header class="heading">
        <div class="heading-container">
            <h1>Recipe Book</h1>
            <img src="images/recipe-book.png" alt="Recipe Book">
        </div>

        <form class="search-form">
            <div class="search-container">
                <input type="search" placeholder="Find a recipe" aria-label="Search recipes">
                <img src="images/search.svg" alt="Search icon" class="search-icon">
            </div>
        </form>

    </header>

    <main>
        <section id="container">
            <img src="images/apple-crisp.jpg" alt="apple crisp">
            <h2>Apple Crisp</h2>

            <span
              class="rating"
              role="img"
              aria-label="Rating: 4 out of 5 stars"
            >
              <span aria-hidden="true" class="icon-star">⭐</span>
              <span aria-hidden="true" class="icon-star">⭐</span>
              <span aria-hidden="true" class="icon-star">⭐</span>
              <span aria-hidden="true" class="icon-star">⭐</span>
              <span aria-hidden="true" class="icon-star-empty">☆</span>
            </span>

            <p>This apple crisp is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.</p>
        </section>        

    </main>

    <footer>
    
    <div class="social">
      <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
      <a  href="#"><img class="social-icon" src="images/instagram_icon.svg" alt="instagram icon"></a>
      <a  href="#"><img class="social-icon" src="images/youtube_icon.svg" alt="youtube icon"></a>
      <a  href="#"><img class="social-icon" src="images/pinterest_icon.svg" alt="pinterest icon"></a> 
    </div>             
    
      <a id="freepik" href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a> 
                
                

    </footer>
    
</body>
</html>
