<header>
  <nav>
    <div class="logo">
      <img src="images/logo.png" alt="Giant Sourcing Logo">
      <span>Giant Sourcing</span>
    </div>
    
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about_us.html">About</a>
      <a href="services.html">Services</a>

    </div>

    <button class="menu-btn">
          <div class="bar1"></div>
          <div class="bar2"></div>
          <div class="bar3"></div>
    </button>
  </nav>

  
</header>

<main>

    <h1 class="contacth1">Contact Us</h1>
    <p class="formtext">Have questions or want to learn more about our services? Fill out the form below and we'll get back to you as soon as possible.</p>

    <section class="errors" id="formMessage" aria-live="polite"></section>

    <form id="contactForm" action="#" method="post" novalidate>

      <label for="fullName">Full Name:</label>
      <input type="text" id="fullName" name="fullName" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="email@email.com" required>

      <label for="subject">Subject:</label>
      <select id="subject" name="subject" required>
        <option value="">Select a subject</option>
        <option value="general">General Inquiry</option>
        <option value="service">Service Request</option>
        <option value="support">Support</option>
      </select>

      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <label for="phone">Phone (optional):</label>
      <input type="tel" id="phone" name="phone" placeholder="+261 xxx xxx xxx">

      <button id="contactussendbtn" type="submit">Send Message</button>

    </form>
  
<footer>
  <p>Giant Sourcing © 2026 - Tiana Andriarimalala</p>
</footer>
 

</main>



</body>
